name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      - name: Validate release identity and workflows
        run: |
          python3 scripts/release.py check
          bash scripts/lint-workflows.sh
          bash -n scripts/build-linux.sh scripts/ci-linux.sh scripts/lint-workflows.sh
      - name: Frontend and Python checks
        run: |
          npm ci
          npm run format:check
          npm test
          npm run build
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Rust core checks
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Browser journeys
        run: |
          npx --no-install playwright install --with-deps chromium
          npm run test:e2e -- --workers=2
      - name: Browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  python-compat:
    name: Release helper / Python 3.10
    runs-on: ubuntu-24.04
    container: python:3.10-slim-bookworm
    timeout-minutes: 10
    steps:
      - name: Install checkout dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Backport compatibility and release guards
        run: |
          python3 -m venv /tmp/release-venv
          /tmp/release-venv/bin/python -m pip install -r scripts/requirements-release.txt
          /tmp/release-venv/bin/python scripts/release.py check
          /tmp/release-venv/bin/python -m unittest discover -s tests -p 'test_release.py' -v

  linux:
    name: Debian amd64 package
    needs: checks
    runs-on: ubuntu-24.04
    container: rust:1.100.0-bookworm
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Debian build and fixture dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates curl python3 build-essential pkg-config \
            libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev patchelf \
            xvfb xauth dbus-x11 fonts-dejavu-core webkit2gtk-driver openssh-server openssh-client \
            openssl docker.io
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned native test driver
        run: |
          rustup component add rustfmt clippy --toolchain 1.100.0
          cargo install tauri-driver --version 2.1.0 --locked
      - name: Verify transport, package reproducibility and native executable
        run: bash scripts/ci-linux.sh
      - name: Release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-amd64-release
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
      - name: Native and transport evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-transport-evidence
          path: |
            artifacts/ci-native/
            artifacts/remote-context-report.json
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Draft GitHub release
    needs: [checks, python-compat, linux]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'JNevrly/docker-cleanup'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-amd64-release
          path: release-assets
      - name: Create draft (never overwrite an existing release)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cd release-assets
          sha256sum -c "docker-cleanup_${TAG#v}_amd64.deb.sha256"
          gh release create "$TAG" --repo "$GH_REPO" --verify-tag --draft \
            --title "Docker Cleanup $TAG" --notes-file release-notes.md \
            "docker-cleanup_${TAG#v}_amd64.deb" \
            "docker-cleanup_${TAG#v}_amd64.deb.sha256" release-manifest.json
